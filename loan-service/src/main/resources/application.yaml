server:
  port: 8085

spring:
  application:
    name: loan-service

  datasource:
    url: jdbc:mysql://localhost:3306/microloan_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  main:
    allow-circular-references: true

# Optional logging (useful for debugging)
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG